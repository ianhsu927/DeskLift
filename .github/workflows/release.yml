name: Release DeskLift

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag, e.g. v1.0.0; validation can use a new name, publishing requires an existing tag'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release after validation and packaging'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Serialize release builds on the development Mac and publication for this repo.
concurrency:
  group: desklift-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_ARTIFACT: desklift-release-${{ github.run_id }}-${{ github.run_attempt }}
  VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  TZ: Asia/Shanghai

jobs:
  build:
    name: Test and package on Mac mini
    runs-on: [self-hosted, macOS, ARM64, desklift-mini]
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version tag such as v1.0.0, without leading zeros.' >&2
            exit 1
          fi

      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare tagged source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # Query GitHub rather than trusting a tag left by an earlier local-only validation.
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git checkout --detach "refs/tags/$RELEASE_TAG"
          else
            remote_status=$?
            if [[ "$remote_status" != 2 || "$VALIDATION_ONLY" != true ]]; then
              echo 'Publishing requires an existing remote tag; remote lookup failures also abort validation.' >&2
              exit 1
            fi
            # A missing remote tag is allowed only for manual validation. It never leaves this checkout.
            git checkout --detach "$GITHUB_SHA"
            git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          if [[ "$VALIDATION_ONLY" != true ]]; then
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests and build release packages
        shell: bash
        run: ./scripts/release.sh "$RELEASE_TAG"

      # Only final packages leave this Mac. Build products and module caches stay local.
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            deliverables/${{ env.RELEASE_TAG }}/DeskLift-${{ env.RELEASE_TAG }}-macos-arm64.zip
            deliverables/${{ env.RELEASE_TAG }}/DeskLift-${{ env.RELEASE_TAG }}-source.tar.gz
            deliverables/${{ env.RELEASE_TAG }}/SHA256SUMS.txt
            deliverables/${{ env.RELEASE_TAG }}/release-notes-*.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The build on the home Mac never receives a token that can write the repository.
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$RELEASE_ARTIFACT" \
            --dir release

      - name: Verify and publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          # Refuse a tag that moved while the Mac was building its packages.
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          cd release
          sha256sum --check SHA256SUMS.txt
          shopt -s nullglob
          notes=(release-notes-*.md)
          if (( ${#notes[@]} != 1 )); then
            echo 'Expected exactly one release notes document.' >&2
            exit 1
          fi
          # Creation fails for an existing release; published assets are never overwritten.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeskLift $RELEASE_TAG" \
            --notes-file "${notes[0]}" \
            "DeskLift-$RELEASE_TAG-macos-arm64.zip" \
            "DeskLift-$RELEASE_TAG-source.tar.gz" \
            SHA256SUMS.txt
